[pytest]
filterwarnings =
    # datetime.utcnow() est dépréciée depuis Python 3.12 mais reste
    # parfaitement fonctionnelle. Le remplacement (datetime.now(timezone.utc))
    # change le format stocké (avec fuseau horaire) et n'a pas pu être validé
    # contre l'instance Oracle réelle du projet : non modifié volontairement
    # dans app/models.py et app/routes/transactions.py. Limite assumée,
    # à corriger lors d'une éventuelle migration Python/SQLAlchemy future.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning

    # fraud_model.pkl a été entraîné avec scikit-learn 1.8.0 ; l'environnement
    # local peut avoir une version plus récente (1.9.0), incompatible avec la
    # disponibilité de wheels 1.8.0 sur Python 3.14. Le modèle se charge et
    # prédit correctement malgré l'avertissement (vérifié par les tests
    # test_create_transaction_success et test_high_risk_transaction_creates_fraud_alert).
    # Limite assumée : idéalement, réentraîner le modèle avec la version de
    # scikit-learn figée dans requirements.txt avant une mise en production.
    ignore:Trying to unpickle estimator.*:sklearn.exceptions.InconsistentVersionWarning
    ignore:.*does not have valid feature names.*:UserWarning

    # Avertissement interne à joblib/numpy lors du désérialisation du modèle
    # (assignation directe de .shape), sans impact sur le résultat.
    ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning
