<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Comptes – SG SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

<div id="navbar"></div>
<div class="d-flex">
    <div id="sidebar"></div>

    <div class="container-fluid p-4">

        <!-- En-tête -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-0">🏦 Comptes bancaires</h4>
                <p class="text-muted small mb-0" id="comptesCount">Chargement…</p>
            </div>
            <button class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#addCompteModal">
                + Nouveau compte
            </button>
        </div>

        <!-- Filtres -->
        <div class="card p-3 mb-3">
            <div class="row g-2 align-items-center">
                <div class="col-md-5">
                    <input id="searchCompte" class="form-control" placeholder="🔍 Rechercher (IBAN, type, statut, client ID)…">
                </div>
                <div class="col-md-3">
                    <select id="statutFilter" class="form-select">
                        <option value="">Tous les statuts</option>
                        <option value="ACTIF">Actif</option>
                        <option value="SUSPENDU">Suspendu</option>
                        <option value="CLOTURE">Clôturé</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-secondary w-100" onclick="refreshComptes()">↻ Actualiser</button>
                </div>
            </div>
        </div>

        <!-- Tableau -->
        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Client ID</th>
                            <th>Numéro IBAN</th>
                            <th>Type</th>
                            <th>Solde</th>
                            <th>Devise</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="comptesTable">
                        <tr><td colspan="8" class="text-center text-muted py-4">Chargement…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal ajout compte -->
<div class="modal fade" id="addCompteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Nouveau compte bancaire</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="compteForm">
                    <div class="row g-2">
                        <div class="col-12">
                            <label class="form-label fw-semibold">ID Client <span class="text-danger">*</span></label>
                            <input id="clientId" class="form-control" placeholder="Ex : 42" type="number" min="1" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Numéro IBAN <span class="text-danger">*</span></label>
                            <input id="numeroCompte" class="form-control" placeholder="FR76 3000 6000 0112 3456 7890 189" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Type de compte</label>
                            <select id="typeCompte" class="form-select">
                                <option value="COURANT">Courant</option>
                                <option value="EPARGNE">Épargne</option>
                                <option value="PROFESSIONNEL">Professionnel</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Devise</label>
                            <select id="deviseCompte" class="form-select">
                                <option value="EUR">EUR €</option>
                                <option value="USD">USD $</option>
                                <option value="GBP">GBP £</option>
                                <option value="CHF">CHF</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Solde initial (€)</label>
                            <input id="solde" class="form-control" placeholder="0.00" type="number" step="0.01" min="0" value="0">
                        </div>
                    </div>
                    <button type="submit" id="submitCompteBtn" class="btn btn-primary w-100 mt-3 fw-bold">
                        Créer le compte
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/comptes.js"></script>
</body>
</html>
