<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Transactions – SG SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

<div id="navbar"></div>
<div class="d-flex">
    <div id="sidebar"></div>

    <div class="container-fluid p-4">

        <!-- Formulaire nouvelle transaction -->
        <div class="card p-4 mb-4" style="max-width:600px;">
            <h5 class="fw-bold mb-3">➕ Nouvelle transaction</h5>
            <form id="txForm">
                <div class="row g-2">
                    <div class="col-6">
                        <input id="compteId" class="form-control" placeholder="ID Compte" type="number" required>
                    </div>
                    <div class="col-6">
                        <select id="typeTx" class="form-select" required>
                            <option value="VIREMENT">Virement</option>
                            <option value="PAIEMENT_EN_LIGNE">Paiement en ligne</option>
                            <option value="RETRAIT">Retrait</option>
                            <option value="DEPOT">Dépôt</option>
                            <option value="TRANSACTION_MOBILE">Mobile</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <input id="montant" class="form-control" placeholder="Montant" type="number" step="0.01" required>
                    </div>
                    <div class="col-6">
                        <select id="devise" class="form-select">
                            <option value="EUR">EUR</option>
                            <option value="USD">USD</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <input id="paysO" class="form-control" placeholder="Pays origine" value="France">
                    </div>
                    <div class="col-6">
                        <input id="paysD" class="form-control" placeholder="Pays destination" value="France">
                    </div>
                </div>
                <button id="submitTxBtn" type="submit" class="btn btn-primary mt-3 w-100 fw-bold">Créer la transaction</button>
            </form>
        </div>

        <!-- Table transactions -->
        <div class="card p-4">
            <h5 class="fw-bold mb-3">📋 Historique des transactions</h5>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Type</th>
                            <th>Montant</th>
                            <th>Pays</th>
                            <th>Date</th>
                            <th>Score risque</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTable">
                        <tr><td colspan="7" class="text-center text-muted">Chargement…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/transactions.js"></script>
</body>
</html>
