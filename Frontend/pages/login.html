<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion – SG SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card shadow-lg">
        <div class="login-logo">
            <img src="../assets/logo.svg" alt="SG SecureBank" onerror="this.style.display='none'">
            <h4 class="mt-2 fw-bold" style="color:#e30613;">SG SecureBank</h4>
            <p class="text-muted small">Plateforme anti-fraude</p>
        </div>

        <form onsubmit="login(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input id="email" type="email" class="form-control" placeholder="analyste@bank.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Mot de passe</label>
                <input id="password" type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Se connecter</button>
        </form>

        <p id="loginError" class="text-danger text-center mt-3 small" style="display:none;"></p>
    </div>
</div>

<script src="../assets/js/config.js"></script>
<script>
// login.html n'utilise pas requireAuth()
async function login(event) {
    event.preventDefault();
    const email    = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errEl    = document.getElementById("loginError");
    errEl.style.display = "none";

    try {
        const response = await fetch(API_URL + "/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (data.token) {
            setToken(data.token);
            localStorage.setItem("user", JSON.stringify({ nom: data.nom, prenom: data.prenom }));
            window.location.href = "dashboard.html";
        } else {
            errEl.textContent    = data.message || "Identifiants incorrects";
            errEl.style.display  = "block";
        }
    } catch (err) {
        errEl.textContent   = "Impossible de contacter le serveur";
        errEl.style.display = "block";
    }
}
</script>
</body>
</html>
