<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Clients – SG SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

<div id="navbar"></div>
<div class="d-flex">
    <div id="sidebar"></div>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold">👤 Clients</h4>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addClientModal">
                + Nouveau client
            </button>
        </div>

        <div id="clientsList">
            <p class="text-muted">Chargement…</p>
        </div>
    </div>
</div>

<!-- Modal ajout client -->
<div class="modal fade" id="addClientModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Nouveau client</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="clientForm">
                    <div class="row g-2">
                        <div class="col-6">
                            <input id="nom"    class="form-control" placeholder="Nom"    required>
                        </div>
                        <div class="col-6">
                            <input id="prenom" class="form-control" placeholder="Prénom" required>
                        </div>
                        <div class="col-12">
                            <input id="email"  class="form-control" placeholder="Email" type="email" required>
                        </div>
                        <div class="col-12">
                            <input id="motDePasse" class="form-control" placeholder="Mot de passe" type="password" required>
                        </div>
                        <div class="col-6">
                            <input id="telephone"     class="form-control" placeholder="Téléphone">
                        </div>
                        <div class="col-6">
                            <input id="dateNaissance" class="form-control" type="date" required>
                        </div>
                        <div class="col-12">
                            <input id="adresse" class="form-control" placeholder="Adresse">
                        </div>
                        <div class="col-12">
                            <input id="pays" class="form-control" placeholder="Pays" value="France">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3 fw-bold">Créer le client</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/clients.js"></script>
</body>
</html>
