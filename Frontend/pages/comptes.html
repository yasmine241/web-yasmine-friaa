<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Comptes – SG SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

<div id="navbar"></div>
<div class="d-flex">
    <div id="sidebar"></div>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold">🏦 Comptes bancaires</h4>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCompteModal">
                + Nouveau compte
            </button>
        </div>

        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Client ID</th>
                            <th>Numéro</th>
                            <th>Type</th>
                            <th>Solde</th>
                            <th>Devise</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody id="comptesTable">
                        <tr><td colspan="7" class="text-center text-muted">Chargement…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal ajout compte -->
<div class="modal fade" id="addCompteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Nouveau compte</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="compteForm">
                    <div class="row g-2">
                        <div class="col-12">
                            <input id="clientId"     class="form-control" placeholder="ID Client" type="number" required>
                        </div>
                        <div class="col-12">
                            <input id="numeroCompte" class="form-control" placeholder="Numéro IBAN" required>
                        </div>
                        <div class="col-6">
                            <select id="typeCompte" class="form-select">
                                <option value="COURANT">Courant</option>
                                <option value="EPARGNE">Épargne</option>
                                <option value="PROFESSIONNEL">Professionnel</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <input id="solde" class="form-control" placeholder="Solde initial" type="number" step="0.01" value="0">
                        </div>
                        <div class="col-6">
                            <select id="deviseCompte" class="form-select">
                                <option value="EUR">EUR</option>
                                <option value="USD">USD</option>
                                <option value="GBP">GBP</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3 fw-bold">Créer le compte</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
async function loadComptes() {
    try {
        const data  = await getComptes();
        const tbody = document.getElementById("comptesTable");

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Aucun compte.</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(c => `
            <tr>
                <td>#${c.id}</td>
                <td>${c.client_id}</td>
                <td><code>${c.numero_compte}</code></td>
                <td>${c.type_compte}</td>
                <td class="fw-bold">${Number(c.solde).toLocaleString("fr-FR")} ${c.devise}</td>
                <td>${c.devise}</td>
                <td><span class="badge-statut badge-${c.statut}">${c.statut}</span></td>
            </tr>
        `).join("");
    } catch (err) {
        console.error("Erreur comptes:", err);
    }
}

async function submitCompte(e) {
    e.preventDefault();
    const data = {
        client_id:     parseInt(document.getElementById("clientId").value),
        numero_compte: document.getElementById("numeroCompte").value,
        type_compte:   document.getElementById("typeCompte").value,
        solde:         parseFloat(document.getElementById("solde").value) || 0,
        devise:        document.getElementById("deviseCompte").value
    };
    try {
        await createCompte(data);
        showToast("Compte créé ✅");
        document.getElementById("compteForm").reset();
        bootstrap.Modal.getInstance(document.getElementById("addCompteModal"))?.hide();
        loadComptes();
    } catch (err) {
        showToast("Erreur : " + err.message, "danger");
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    requireAuth();
    await loadComponent("navbar",  "../components/navbar.html");
    await loadComponent("sidebar", "../components/sidebar.html");
    loadComptes();
    document.getElementById("compteForm").addEventListener("submit", submitCompte);
});
</script>
</body>
</html>
