<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraudes – SG SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

<div id="navbar"></div>

<div class="d-flex sg-layout">
    <div id="sidebar"></div>

    <div class="container-fluid p-4">

        <!-- Vérification manuelle -->
        <div class="card mb-4 p-4" style="max-width:540px;">
            <h5 class="fw-bold mb-3">🔍 Vérification manuelle</h5>
            <div class="row g-2">
                <div class="col-6">
                    <input id="amount" class="form-control" placeholder="Montant (€)" type="number" min="0" step="0.01">
                </div>
                <div class="col-6">
                    <select id="typeTransaction" class="form-select">
                        <option value="VIREMENT">Virement</option>
                        <option value="PAIEMENT_EN_LIGNE">Paiement en ligne</option>
                        <option value="RETRAIT">Retrait</option>
                        <option value="DEPOT">Dépôt</option>
                        <option value="TRANSACTION_MOBILE">Mobile</option>
                    </select>
                </div>
                <div class="col-6">
                    <input id="paysOrigine"     class="form-control" placeholder="Pays origine"      value="France">
                </div>
                <div class="col-6">
                    <input id="paysDestination" class="form-control" placeholder="Pays destination"  value="France">
                </div>
            </div>
            <button class="btn btn-danger mt-3 w-100 fw-bold" onclick="checkFraud()">Analyser</button>
            <div id="result" class="mt-3"></div>
        </div>

        <!-- Liste des alertes -->
        <div class="card p-4">
            <h5 class="fw-bold mb-3">🚨 Alertes de fraude</h5>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Transaction</th>
                            <th>Type</th>
                            <th>Niveau</th>
                            <th>Score ML</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="fraudTableBody">
                        <tr><td colspan="7" class="text-center text-muted">Chargement…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/fraud.js"></script>
</body>
</html>
